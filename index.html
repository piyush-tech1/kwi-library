function fmt(n){if(n>=1000000)return (n/1000000).toFixed(1)+'M';if(n>=1000)return (n/1000).toFixed(1)+'K';return n+'';}
function catLabel(id){for(var i=0;i<CATS.length;i++)if(CATS[i].id===id)return CATS[i].label;return id;}
function catCount(id){if(id==='all')return RAW.length;return RAW.filter(function(v){return v.cat===id;}).length;}

function getFiltered(){
  var q=document.getElementById('sq').value.toLowerCase().trim();
  var res=RAW;
  if(activeCat!=='all')res=res.filter(function(v){return v.cat===activeCat;});
  if(q)res=res.filter(function(v){return v.title.toLowerCase().indexOf(q)>-1||v.cat.toLowerCase().indexOf(q)>-1||catLabel(v.cat).toLowerCase().indexOf(q)>-1;});
  if(sortMode==='views')res=res.slice().sort(function(a,b){return b.views-a.views;});
  else if(sortMode==='new')res=res.slice().sort(function(a,b){return new Date(b.published)-new Date(a.published);});
  return res;
}

function buildStats(){
  var total=RAW.reduce(function(s,v){return s+v.views;},0);
  document.getElementById('statbar').innerHTML=
    '<span class="stat">📹 '+RAW.length+' videos</span>'+
    '<span class="stat">👁 '+fmt(total)+' total views</span>'+
    '<span class="stat">📁 16 categories</span>'+
    '<span class="stat">🔗 All links from your real CSV</span>';
}

function buildCats(){
  var h='';
  for(var i=0;i<CATS.length;i++){
    var c=CATS[i];var n=catCount(c.id);
    h+='<button class="cb'+(activeCat===c.id?' on':'')+'" onclick="setCat(\''+c.id+'\')">'+c.label+' ('+n+')</button>';
  }
  document.getElementById('cats').innerHTML=h;
}

function buildList(){
  var res=getFiltered();
  var q=document.getElementById('sq').value.trim();
  var info='Showing '+res.length+' video'+(res.length!==1?'s':'');
  if(q)info+=' matching "'+q+'"';
  else if(activeCat!=='all')info+=' in '+catLabel(activeCat);
  document.getElementById('rinfo').textContent=info;
  if(res.length===0){document.getElementById('list').innerHTML='<div class="empty">No videos found.</div>';return;}
  var h='';
  for(var i=0;i<res.length;i++){
    var v=res[i];var open=expanded===v.id;
    h+='<div class="vc">';
    h+='<div class="vc-top" onclick="toggle(\''+v.id+'\')">';
    h+='<div>';
    h+='<div class="vtitle">'+v.title+'</div>';
    h+='<div class="vmeta">';
    h+='<span class="tag c">'+catLabel(v.cat)+'</span>';
    h+='<span class="tag">⏱ '+v.duration+'</span>';
    h+='<span class="tag">👁 '+fmt(v.views)+'</span>';
    h+='<span class="tag">📅 '+v.published+'</span>';
    h+='</div>';
    if(!open)h+='<div class="vtext" style="margin-top:4px;font-size:11px;color:var(--color-text-tertiary)">Click to expand & get YouTube link</div>';
    h+='</div></div>';
    if(open){
      h+='<div class="vbody">';
      h+='<div class="vbody-grid">';
      h+='<div><div class="vlabel">Category</div><div class="vtext">'+catLabel(v.cat)+'</div></div>';
      h+='<div><div class="vlabel">Duration</div><div class="vtext">'+v.duration+'</div></div>';
      h+='<div><div class="vlabel">Views</div><div class="vtext">'+v.views.toLocaleString()+'</div></div>';
      h+='<div><div class="vlabel">Published</div><div class="vtext">'+v.published+'</div></div>';
      h+='</div>';
      h+='<a class="watch-btn" href="'+v.url+'" target="_blank">▶ Watch on YouTube</a>';
      h+='</div>';
    }
    h+='</div>';
  }
  document.getElementById('list').innerHTML=h;
}

function setSort(m){
  sortMode=m;
  ['default','views','new'].forEach(function(x){
    var el=document.getElementById('s-'+x);
    if(el)el.className='sort-btn'+(x===m?' on':'');
  });
  buildList();
}

function setCat(id){activeCat=id;expanded=null;document.getElementById('sq').value='';buildCats();buildList();}
function toggle(id){expanded=expanded===id?null:id;buildList();}

document.getElementById('sq').addEventListener('input',function(){activeCat='all';expanded=null;buildCats();buildList();});

buildStats();buildCats();buildList();
</script>
